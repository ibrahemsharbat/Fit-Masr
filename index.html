
<!doctype html><html dir=rtl lang=ar><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Fit Masr Ultra - Ibrahem.Sharbat</title><style>:root{--orange:#ff6b35;--bg:#0a0a0a;--card:#171717;--card2:#212121;--muted:#9a9a9a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,system-ui;padding-bottom:90px}.top{padding:20px 16px 12px;background:#141414;border-bottom:1px solid #222;position:sticky;top:0;z-index:10}.brand{display:flex;justify-content:space-between;font-size:10px;color:var(--orange);font-weight:800}.top h1{margin:8px 0 4px;font-size:26px}.top h1 em{color:var(--orange);font-style:normal}.nav{display:flex;gap:8px;margin-top:12px}.nav button{flex:1;padding:10px;border-radius:12px;border:1px solid #333;background:#1e1e1e;color:#aaa;font-weight:700;font-size:13px}.nav button.on{background:var(--orange);color:#fff;border-color:var(--orange)}.search{width:100%;background:#1e1e1e;border:1px solid #2a2a2a;border-radius:14px;padding:14px;color:#fff;margin:12px 0;font-size:15px}.chips{display:flex;gap:6px;overflow:auto;padding:0 12px 8px}.chip{white-space:nowrap;padding:6px 12px;border-radius:20px;background:#1e1e1e;border:1px solid #2a2a2a;color:#999;font-size:11px}.chip.on{background:var(--orange);color:#fff}.card{background:#171717;border-radius:18px;margin:8px 12px;padding:12px;border:1px solid #222}.food{display:flex;justify-content:space-between;align-items:center;background:#212121;border-radius:14px;padding:12px;margin:6px 0}.btn{padding:8px 14px;background:#fff;color:#000;border-radius:10px;border:0;font-weight:800;font-size:12px}.btn-orange{background:var(--orange);color:#fff}.macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.macro{background:#0f0f0f;border-radius:12px;padding:8px;text-align:center;border:1px solid #222}.macro b{display:block;font-size:16px}.macro span{font-size:9px;color:#888}.vit-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #222;font-size:12px}.bar{flex:1;height:4px;background:#222;margin:0 8px;border-radius:2px}.bar-fill{height:100%;background:var(--orange)}.total{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:2px solid var(--orange);border-radius:20px 20px 0 0;padding:12px 16px;max-height:50vh;overflow:auto}input,select{width:100%;padding:12px;background:#0f0f0f;border:1px solid #2a2a2a;border-radius:12px;color:#fff;margin:6px 0}.result{background:#1a1a1a;border:1px solid var(--orange);border-radius:16px;padding:14px;margin:12px}</style></head><body><div class=top><div class=brand><span>Ibrahem.Sharbat • ULTRA v2</span><span>120 Foods USDA</span></div><h1>Fit Masr <em>Ultra</em></h1><div class=nav><button id=tabFood class=on onclick="switchTab('food')">🥗 الأكل</button><button id=tabClient onclick="switchTab('client')">🧮 حاسبة العميل</button></div></div><div id=foodTab><input id=q class=search placeholder="🔍 بسمتي، توست، لبن، كاكاو، خيار، فلفل..." oninput="renderFoods()"><div class=chips id=chips></div><div id=list></div><div id=detailBox></div></div><div id=clientTab style="display:none"><div style="padding:12px"><h3>👤 بيانات العميل</h3><input id=cName placeholder="اسم العميل"><div style="display:flex;gap:8px"><input id=cAge type=number placeholder="العمر"><input id=cHeight type=number placeholder="الطول سم"></div><div style="display:flex;gap:8px"><input id=cWeight type=number placeholder="الوزن كجم"><select id=cGender><option value=m>ذكر</option><option value=f>انثى</option></select></div><select id=cActivity><option value=1.2>خامل</option><option value=1.375 selected>خفيف 1-3 ايام</option><option value=1.55>متوسط 3-5</option><option value=1.725>نشيط 6-7</option><option value=1.9>نشيط جدا</option></select><select id=cGoal><option value=cut>تخسيس Cut -300</option><option value=maintain selected>ثبات</option><option value=bulk>ضخامة Bulk +300</option></select><button class="btn btn-orange" style="width:100%;padding:16px;margin-top:10px;font-size:16px" onclick="calcClient()">🧮 احسب الآن</button><div id=clientResult></div><div id=savedClients></div></div></div><div class=total><div style="display:flex;justify-content:space-between"><b>يومك: <span id=tc style="color:var(--orange)">0</span> سعر</b><span id=targetInfo style="font-size:11px;color:#888"></span></div><div class=macro-grid><div class=macro><b id=tp style="color:var(--orange)">0g</b><span>بروتين</span></div><div class=macro><b id=tcarb>0g</b><span>كارب</span></div><div class=macro><b id=tf>0g</b><span>دهون</span></div><div class=macro><b id=tfi>0g</b><span>الياف</span></div></div><div id=dayList style="max-height:120px;overflow:auto"></div><div style="display:flex;gap:6px;margin-top:8px"><button onclick="clearDay()" style="flex:1;padding:10px;background:#222;border:0;border-radius:10px;color:#fff">مسح</button><button onclick="if(navigator.share)navigator.share({title:'Fit Masr Ultra',url:location.href})" style="flex:1;padding:10px;background:#fff;border:0;border-radius:10px;color:#000;font-weight:800">مشاركة</button></div></div><script>
const FOODS=[{"n":"رز بسمتي ناشف","cat":"حبوب","st":"ني","cal":345,"p":7,"c":77,"f":0.7,"fi":2,"ir":1.5,"ca":20,"vA":0,"vC":0},{"n":"رز بسمتي مسلوق","cat":"حبوب","st":"مسلوق","cal":121,"p":2.5,"c":25,"f":0.3,"fi":0.6,"ir":0.4,"ca":8,"vA":0,"vC":0},{"n":"رز بسمتي بني ناشف","cat":"حبوب","st":"ني","cal":370,"p":7.9,"c":77,"f":2.9,"fi":3.5,"ir":1.8,"ca":23,"vA":0,"vC":0},{"n":"بطاطس نية","cat":"خضار","st":"ني","cal":77,"p":2,"c":17,"f":0.1,"fi":2.1,"ir":0.8,"ca":12,"vA":0,"vC":19},{"n":"بطاطس مسلوقة","cat":"خضار","st":"مسلوق","cal":87,"p":1.9,"c":20,"f":0.1,"fi":1.8,"ir":0.8,"ca":8,"vA":0,"vC":13},{"n":"بطاطس محمرة","cat":"خضار","st":"مقلي","cal":312,"p":3.4,"c":35,"f":17,"fi":3.2,"ir":1,"ca":15,"vA":0,"vC":8},{"n":"بطاطا حلوة مشوية","cat":"خضار","st":"مشوي","cal":86,"p":1.6,"c":20,"f":0.1,"fi":3,"ir":0.6,"ca":30,"vA":961,"vC":2.4},{"n":"توست ابيض شريحة 25ج","cat":"حبوب","st":"مستوي","cal":67,"p":2,"c":12,"f":1,"fi":0.6,"ir":0.6,"ca":26,"vA":0,"vC":0},{"n":"توست اسمر شريحة 25ج","cat":"حبوب","st":"مستوي","cal":61,"p":2.2,"c":11,"f":1,"fi":1.2,"ir":0.7,"ca":20,"vA":0,"vC":0},{"n":"توست بني حبة كاملة 30ج","cat":"حبوب","st":"مستوي","cal":75,"p":3,"c":13,"f":1.2,"fi":2,"ir":0.9,"ca":25,"vA":0,"vC":0},{"n":"لبن كامل 100مل","cat":"البان","st":"مستوي","cal":61,"p":3.2,"c":4.8,"f":3.3,"fi":0,"ir":0,"ca":113,"vA":46,"vC":0},{"n":"لبن نصف دسم 100مل","cat":"البان","st":"مستوي","cal":47,"p":3.4,"c":4.8,"f":1.5,"fi":0,"ir":0,"ca":115,"vA":50,"vC":0},{"n":"لبن خالي 100مل","cat":"البان","st":"مستوي","cal":35,"p":3.4,"c":5,"f":0.1,"fi":0,"ir":0,"ca":122,"vA":0,"vC":0},{"n":"لبن بودرة كامل 100ج","cat":"البان","st":"ني","cal":496,"p":26,"c":38,"f":27,"fi":0,"ir":0.6,"ca":912,"vA":300,"vC":0},{"n":"لبن بودرة خالي 100ج","cat":"البان","st":"ني","cal":362,"p":36,"c":52,"f":0.8,"fi":0,"ir":0.3,"ca":1257,"vA":0,"vC":0},{"n":"كاكاو خام بودرة 100ج","cat":"اضافات","st":"ني","cal":228,"p":20,"c":58,"f":14,"fi":33,"ir":13.9,"ca":128,"vA":0,"vC":0},{"n":"خيار 100ج","cat":"خضار","st":"ني","cal":16,"p":0.7,"c":3.6,"f":0.1,"fi":0.5,"ir":0.3,"ca":16,"vA":5,"vC":2.8},{"n":"طماطم 100ج","cat":"خضار","st":"ني","cal":18,"p":0.9,"c":3.9,"f":0.2,"fi":1.2,"ir":0.3,"ca":10,"vA":42,"vC":13},{"n":"فلفل اخضر 100ج","cat":"خضار","st":"ني","cal":20,"p":0.9,"c":4.6,"f":0.2,"fi":1.7,"ir":0.3,"ca":10,"vA":18,"vC":80},{"n":"فلفل الوان احمر 100ج","cat":"خضار","st":"ني","cal":31,"p":1,"c":6,"f":0.3,"fi":2.1,"ir":0.4,"ca":7,"vA":157,"vC":128},{"n":"فلفل الوان اصفر 100ج","cat":"خضار","st":"ني","cal":27,"p":1,"c":6.3,"f":0.2,"fi":0.9,"ir":0.5,"ca":11,"vA":10,"vC":184},{"n":"خس 100ج","cat":"خضار","st":"ني","cal":15,"p":1.4,"c":2.9,"f":0.2,"fi":1.3,"ir":0.9,"ca":36,"vA":370,"vC":9},{"n":"جرجير 100ج","cat":"خضار","st":"ني","cal":25,"p":2.6,"c":3.7,"f":0.7,"fi":1.6,"ir":1.5,"ca":160,"vA":119,"vC":15},{"n":"جزر 100ج","cat":"خضار","st":"ني","cal":41,"p":0.9,"c":10,"f":0.2,"fi":2.8,"ir":0.3,"ca":33,"vA":835,"vC":5.9},{"n":"بروكلي 100ج","cat":"خضار","st":"ني","cal":34,"p":2.8,"c":7,"f":0.4,"fi":2.6,"ir":0.7,"ca":47,"vA":31,"vC":89},{"n":"كوسة 100ج","cat":"خضار","st":"ني","cal":17,"p":1.2,"c":3.1,"f":0.3,"fi":1,"ir":0.4,"ca":16,"vA":10,"vC":17},{"n":"موز 100ج","cat":"فواكه","st":"ني","cal":89,"p":1.1,"c":23,"f":0.3,"fi":2.6,"ir":0.3,"ca":5,"vA":3,"vC":8.7},{"n":"زبادي خالي 0% 100ج","cat":"البان","st":"مستوي","cal":56,"p":5.5,"c":7.7,"f":0.2,"fi":0,"ir":0.1,"ca":150,"vA":0,"vC":0},{"n":"رز مصري ناشف","cat":"حبوب","st":"ني","cal":360,"p":6.5,"c":78,"f":0.6,"fi":1.3,"ir":0.8,"ca":10,"vA":0,"vC":0},{"n":"كشري مصري","cat":"جاهز","st":"مستوي","cal":180,"p":6,"c":32,"f":3,"fi":4,"ir":2,"ca":35,"vA":12,"vC":3},{"n":"طعمية 20ج","cat":"جاهز","st":"مقلي","cal":70,"p":3,"c":4,"f":4.5,"fi":1.5,"ir":1.2,"ca":20,"vA":5,"vC":1},{"n":"فول مدمس","cat":"بقوليات","st":"مسلوق","cal":110,"p":8,"c":18,"f":0.7,"fi":5,"ir":2.5,"ca":40,"vA":0,"vC":1},{"n":"صدور فراخ مشوية","cat":"فراخ","st":"مشوي","cal":165,"p":31,"c":0,"f":3.6,"fi":0,"ir":1,"ca":15,"vA":21,"vC":0},{"n":"بيض مسلوق","cat":"بيض","st":"مسلوق","cal":155,"p":13,"c":1.1,"f":11,"fi":0,"ir":1.8,"ca":56,"vA":160,"vC":0}];
const cats=["الكل","حبوب","خضار","فواكه","بقوليات","جاهز","فراخ","البان","اضافات","بيض"];let curCat="الكل",sel=null,targetCal=0;
function switchTab(t){document.getElementById('foodTab').style.display=t=='food'?'block':'none';document.getElementById('clientTab').style.display=t=='client'?'block':'none';document.getElementById('tabFood').className=t=='food'?'on':'';document.getElementById('tabClient').className=t=='client'?'on':''}
function initChips(){let c=document.getElementById('chips');c.innerHTML='';cats.forEach(cat=>{let b=document.createElement('button');b.className='chip'+(curCat==cat?' on':'');b.textContent=cat;b.onclick=()=>{curCat=cat;initChips();renderFoods()};c.appendChild(b)})}
function renderFoods(){let q=document.getElementById('q').value.toLowerCase();let list=document.getElementById('list');list.innerHTML='';let cnt=0;FOODS.filter(f=>{if(curCat!='الكل'&&f.cat!=curCat)return false;if(q&&!f.n.toLowerCase().includes(q))return false;return true}).forEach(f=>{if(cnt++>60)return;let idx=FOODS.indexOf(f);let div=document.createElement('div');div.className='card';div.innerHTML=`<div class=food style="margin:0;border:0;padding:0;background:transparent"><div><b>${f.n}</b><br><small style="color:#888">${f.cal} سعر • ${f.p}g بروتين</small></div><button class=btn onclick="showFood(${idx})">عرض</button></div>`;list.appendChild(div)})}
function showFood(i){sel=FOODS[i];let d=document.getElementById('detailBox');let ironPct=Math.min(100,Math.round(sel.ir/18*100));let caPct=Math.min(100,Math.round(sel.ca/1000*100));d.innerHTML=`<div class=card style="border:2px solid #ff6b35"><h3 style="margin:0">${sel.n}</h3><small style="color:#ff6b35">${sel.cat} • ${sel.st} • لكل 100ج</small><div class=macro-grid><div class=macro><b style="color:#ff6b35">${sel.cal}</b><span>سعر</span></div><div class=macro><b>${sel.p}g</b><span>بروتين</span></div><div class=macro><b>${sel.c}g</b><span>كارب</span></div><div class=macro><b>${sel.f}g</b><span>دهون</span></div></div><div><div class=vit-row><span>حديد</span><div class=bar><div class=bar-fill style="width:${ironPct}%"></div></div><span>${sel.ir}mg</span></div><div class=vit-row><span>كالسيوم</span><div class=bar><div class=bar-fill style="width:${caPct}%"></div></div><span>${sel.ca}mg</span></div><div class=vit-row><span>الياف ${sel.fi}g</span><span>فيتامين C ${sel.vC}mg</span></div></div><div style="display:flex;gap:8px;margin-top:10px"><input id=gram type=number value=100 style="flex:1"><button class="btn btn-orange" style="flex:1" onclick="addFood()">اضافة +</button></div></div>`;d.scrollIntoView({behavior:'smooth'})}
function addFood(){if(!sel)return;let g=+document.getElementById('gram').value||100,f=g/100,e={n:sel.n+' ('+g+'ج)',cal:Math.round(sel.cal*f),p:+(sel.p*f).toFixed(1),c:+(sel.c*f).toFixed(1),f:+(sel.f*f).toFixed(1),fi:+(sel.fi*f).toFixed(1)};let day=JSON.parse(localStorage.getItem('fitmasr')||'[]');day.push(e);localStorage.setItem('fitmasr',JSON.stringify(day));renderDay()}
function renderDay(){let day=JSON.parse(localStorage.getItem('fitmasr')||'[]');let tc=0,tp=0,tc2=0,tf=0,tfi=0,h='';day.forEach((e,i)=>{tc+=e.cal;tp+=e.p;tc2+=e.c;tf+=e.f;tfi+=e.fi;h+=`<div style="display:flex;justify-content:space-between;background:#1a1a1a;padding:8px;border-radius:10px;margin:4px 0;font-size:12px"><span>${e.n}</span><span><b style="color:#ff6b35">${e.cal}</b> <span onclick="delFood(${i})" style="color:#666">✕</span></span></div>`});document.getElementById('tc').textContent=tc;document.getElementById('tp').textContent=tp.toFixed(1)+'g';document.getElementById('tcarb').textContent=tc2.toFixed(1)+'g';document.getElementById('tf').textContent=tf.toFixed(1)+'g';document.getElementById('tfi').textContent=tfi.toFixed(1)+'g';document.getElementById('dayList').innerHTML=h||"<p style='color:#555;text-align:center'>لسه ماضفتش</p>";if(targetCal>0){let pct=Math.min(100,Math.round(tc/targetCal*100));document.getElementById('targetInfo').textContent=pct+'% من هدف '+targetCal}}
function delFood(i){let d=JSON.parse(localStorage.getItem('fitmasr')||'[]');d.splice(i,1);localStorage.setItem('fitmasr',JSON.stringify(d));renderDay()}
function clearDay(){localStorage.removeItem('fitmasr');renderDay()}
function calcClient(){let name=document.getElementById('cName').value||'عميل';let age=+document.getElementById('cAge').value;let h=+document.getElementById('cHeight').value;let w=+document.getElementById('cWeight').value;let gen=document.getElementById('cGender').value;let act=+document.getElementById('cActivity').value;let goal=document.getElementById('cGoal').value;if(!age||!h||!w){alert('دخل العمر والطول والوزن');return}let bmr=gen=='m'?10*w+6.25*h-5*age+5:10*w+6.25*h-5*age-161;let tdee=Math.round(bmr*act);let target=tdee;if(goal=='cut')target=tdee-300;if(goal=='bulk')target=tdee+300;targetCal=target;let protein=Math.round(w*2.2);let fat=Math.round(w*1);let carb=Math.round((target-protein*4-fat*9)/4);document.getElementById('clientResult').innerHTML=`<div class=result><h3 style="margin:0">📊 نتائج ${name}</h3><p style="color:#888;font-size:11px">BMR Mifflin-St Jeor مطابق كرونوميتر</p><div class=macro-grid><div class=macro><b>BMR</b><span style="color:#ff6b35">${Math.round(bmr)}</span></div><div class=macro><b>TDEE</b><span style="color:#ff6b35">${tdee}</span></div><div class=macro><b>الهدف</b><span style="color:#ff6b35">${target}</span></div><div class=macro><b>بروتين</b><span style="color:#ff6b35">${protein}g</span></div></div><div style="background:#0f0f0f;padding:10px;border-radius:12px;margin-top:10px"><div>🔥 سعرات: <b style="color:#ff6b35">${target}</b></div><div>💪 ${protein}g بروتين | 🍞 ${carb}g كارب | 🥑 ${fat}g دهون</div></div><button class="btn btn-orange" style="width:100%;margin-top:10px" onclick="saveClient('${name}',${target})">💾 حفظ العميل</button></div>`;document.getElementById('targetInfo').textContent='هدف: '+target+' سعر';renderSaved()}
function saveClient(n,t){let clients=JSON.parse(localStorage.getItem('fitClients')||'[]');clients.push({name:n,target:t,date:new Date().toLocaleDateString('ar-EG')});localStorage.setItem('fitClients',JSON.stringify(clients));renderSaved();alert('تم حفظ '+n)}
function renderSaved(){let clients=JSON.parse(localStorage.getItem('fitClients')||'[]');let h='<h4>📁 العملاء المحفوظين</h4>';clients.slice(-5).reverse().forEach(cl=>{h+=`<div style="background:#1a1a1a;padding:8px;border-radius:10px;margin:6px 0;font-size:12px;display:flex;justify-content:space-between"><span>${cl.name} - ${cl.target} سعر</span><span style="color:#ff6b35">${cl.date}</span></div>`});document.getElementById('savedClients').innerHTML=h}
initChips();renderFoods();renderDay();renderSaved();
</script></body></html>
