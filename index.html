
<!doctype html><html dir=rtl lang=ar><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Fit Masr Pro</title><style>_{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:system-ui;padding:12px}h1{text-align:center;color:#}input,select{width:100%;padding:14px;border-radius:12px;border:0;margin:6px 0;background:#222;color:#fff}button{width:100%;padding:14px;background:#;border:0;border-radius:12px;color:#fff;font-weight:800}.card{background:#;border-radius:16px;padding:12px;margin:10px 0}.stat{display:inline-block;width:23%;text-align:center;background:#222;border-radius:10px;padding:8px;margin:2px}.vit span{background:#222;padding:4px 8px;border-radius:8px;font-size:11px;margin:2px;display:inline-block}</style></head><body><h1>🇪🇬 Fit Masr Pro</h1><p style=text-align:center>كل الاكل المصري ني ومستوي بالفيتامينات</p><div class=card><input id=q placeholder="دور: رز، فراخ، عدس" oninput=render()><select id=cat onchange=render()><option>الكل</option><option>حبوب</option><option>بقوليات</option><option>فراخ</option><option>لحوم</option><option>بيض</option><option>خضار</option></select><select id=state onchange=render()><option>الكل</option><option>ني</option><option>مسلوق</option><option>مشوي</option><option>مقلي</option><option>مستوي</option></select><div id=list></div></div><div id=detail></div><div class=card><h3>يومك: <span id=tc>0</span> سعر</h3><div><span class=stat>بروتين <b id=tp>0</b></span><span class=stat>كارب <b id=tc2>0</b></span><span class=stat>دهون <b id=tf>0</b></span><span class=stat>الياف <b id=tfi>0</b></span></div><div id=day></div><button onclick="localStorage.clear();location.reload()" style="background:#333;margin-top:8px">مسح اليوم</button></div><script>const F=[{n:"رز مصري ناشف",cat:"حبوب",st:"ني",cal:360,p:6.5,c:78,f:0.6,fi:1.3,ir:0.8,ca:10,note:"100ج ناشف=260ج مسلوق"},{n:"رز مصري مسلوق",cat:"حبوب",st:"مسلوق",cal:130,p:2.4,c:28,f:0.2,fi:0.4,ir:0.2,ca:10,note:"بيزيد 2.6 ضعف"},{n:"مكرونة ناشفة",cat:"حبوب",st:"ني",cal:371,p:13,c:74,f:1.5,fi:3,ir:3.3,ca:21,note:"100ج=250ج مسلوقة"},{n:"مكرونة مسلوقة",cat:"حبوب",st:"مسلوق",cal:158,p:5.8,c:30,f:0.9,fi:1.8,ir:1.3,ca:7,note:""},{n:"عدس ناشف",cat:"بقوليات",st:"ني",cal:353,p:25,c:60,f:1,fi:11,ir:7.5,ca:51,note:"100ج=280ج مطبوخ"},{n:"عدس مطبوخ",cat:"بقوليات",st:"مسلوق",cal:116,p:9,c:20,f:0.4,fi:8,ir:3.3,ca:19,note:"بروتين نباتي"},{n:"فول مدمس",cat:"بقوليات",st:"مسلوق",cal:110,p:8,c:18,f:0.7,fi:5,ir:2.5,ca:40,note:""},{n:"كشري مصري",cat:"بقوليات",st:"مستوي",cal:180,p:6,c:32,f:3,fi:4,ir:2,ca:35,note:"رز+عدس+مكرونة"},{n:"صدور فراخ نية",cat:"فراخ",st:"ني",cal:165,p:31,c:0,f:3.6,fi:0,ir:0.7,ca:15,note:"قبل الشوي"},{n:"صدور فراخ مشوية",cat:"فراخ",st:"مشوي",cal:165,p:31,c:0,f:3.6,fi:0,ir:1,ca:15,note:"بدون زيت نفس النية"},{n:"صدور فراخ بانيه مقلية",cat:"فراخ",st:"مقلي",cal:260,p:25,c:8,f:14,fi:0,ir:1,ca:20,note:"البقسماط بيزود"},{n:"وراك فراخ نية",cat:"فراخ",st:"ني",cal:211,p:17,c:0,f:15,fi:0,ir:1,ca:13,note:""},{n:"وراك مشوية",cat:"فراخ",st:"مشوي",cal:229,p:27,c:0,f:13,fi:0,ir:1.3,ca:14,note:"بتخس 25% وزن"},{n:"كبدة فراخ نية",cat:"فراخ",st:"ني",cal:167,p:24,c:1,f:6.5,fi:0,ir:11,ca:11,note:"اعلى حديد A"},{n:"لحمة مفرومة نية",cat:"لحوم",st:"ني",cal:250,p:26,c:0,f:15,fi:0,ir:2.6,ca:18,note:""},{n:"كفتة مشوية",cat:"لحوم",st:"مشوي",cal:280,p:27,c:1,f:18,fi:0,ir:2.8,ca:20,note:""},{n:"كبدة بقري نية",cat:"لحوم",st:"ني",cal:135,p:20,c:4,f:3.6,fi:0,ir:6.5,ca:5,note:"ملك الفيتامينات"},{n:"بيضة نية/مسلوقة",cat:"بيض",st:"مسلوق",cal:70,p:6,c:0.5,f:5,fi:0,ir:0.9,ca:28,note:""},{n:"بيض مقلي",cat:"بيض",st:"مقلي",cal:95,p:6,c:0.5,f:7.5,fi:0,ir:0.9,ca:28,note:""},{n:"بطاطس نية",cat:"خضار",st:"ني",cal:77,p:2,c:17,f:0.1,fi:2.1,ir:0.8,ca:12,note:""},{n:"بطاطس مسلوقة",cat:"خضار",st:"مسلوق",cal:87,p:1.9,c:20,f:0.1,fi:1.8,ir:0.8,ca:8,note:""},{n:"بطاطس محمرة",cat:"خضار",st:"مقلي",cal:312,p:3.5,c:35,f:17,fi:3,ir:1,ca:15,note:"4 اضعاف المسلوقة"}];let sel=null;function render(){let q=document.getElementById('q').value.toLowerCase(),c=document.getElementById('cat').value,s=document.getElementById('state').value,l=document.getElementById('list');l.innerHTML='';F.filter(f=>{if(c!='الكل'&&f.cat!=c)return 0;if(s!='الكل'&&f.st!=s)return 0;if(q&&!f.n.includes(q))return 0;return 1}).forEach((f,i)=>{let idx=F.indexOf(f);let d=document.createElement('div');d.style.cssText='background:#222;padding:10px;border-radius:10px;margin:5px 0;display:flex;justify-content:space-between';d.innerHTML=`<div><b>${f.n}</b><br><small>${f.cat} ${f.st} - ${f.cal} سعر</small></div><button onclick="show(${idx})" style="width:auto;padding:8px 12px">عرض</button>`;l.appendChild(d)})}function show(i){sel=F[i];let d=document.getElementById('detail');d.innerHTML=`<div class=card style="border:2px solid #"><h3>${sel.n}</h3><small>${sel.cat} - ${sel.st}</small><p style="background:#222;padding:8px;border-radius:8px;font-size:12px">💡 ${sel.note}</p><div><span class=stat><b>${sel.cal}</b><br>سعر</span><span class=stat><b>${sel.p}g</b><br>بروتين</span><span class=stat><b>${sel.c}g</b><br>كارب</span><span class=stat><b>${sel.f}g</b><br>دهون</span></div><div class=vit style="margin-top:8px"><span>الياف ${sel.fi}g</span><span>حديد ${sel.ir}mg</span><span>كالسيوم ${sel.ca}mg</span><span>فيتامينات كاملة</span></div><input id=g type=number value=100 style="margin-top:10px"><button onclick="add()">اضافة +</button></div>`;window.scrollTo(0,d.offsetTop)}function add(){if(!sel)return;let g=+document.getElementById('g').value||100,f=g/100,e={n:sel.n+' ('+g+'ج)',cal:Math.round(sel.cal_f),p:+(sel.p_f).toFixed(1),c:+(sel.c_f).toFixed(1),f:+(sel.f_f).toFixed(1),fi:+(sel.fi_f).toFixed(1)};let D=JSON.parse(localStorage.getItem('d')||'[]');D.push(e);localStorage.setItem('d',JSON.stringify(D));renderDay()}function renderDay(){let D=JSON.parse(localStorage.getItem('d')||'[]'),tc=0,tp=0,tc2=0,tf=0,tfi=0,h='';D.forEach((e,i)=>{tc+=e.cal;tp+=e.p;tc2+=e.c;tf+=e.f;tfi+=e.fi;h+=`<div style="display:flex;justify-content:space-between;background:#222;padding:8px;border-radius:8px;margin:4px 0"><span>${e.n}</span><span>${e.cal} <b onclick="del(${i})" style="color:red">x</b></span></div>`});document.getElementById('tc').textContent=tc;document.getElementById('tp').textContent=tp.toFixed(1);document.getElementById('tc2').textContent=tc2.toFixed(1);document.getElementById('tf').textContent=tf.toFixed(1);document.getElementById('tfi').textContent=tfi.toFixed(1);document.getElementById('day').innerHTML=h}function del(i){let D=JSON.parse(localStorage.getItem('d')||'[]');D.splice(i,1);localStorage.setItem('d',JSON.stringify(D));renderDay()}render();renderDay()</script></body></html>
