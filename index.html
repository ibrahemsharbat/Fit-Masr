ف ${sel.fi}g</span><span class=badge>حديد ${sel.ir}mg</span><span class=badge>كالسيوم ${sel.ca}mg</span></div><div style=display:flex;gap:6px><input id=g type=number value=100 style=flex:1><button onclick="add()" style=flex:1>اضافة +</button></div></div>`;window.scrollTo({top:d.offsetTop-10,behavior:'smooth'})}function add(){if(!sel)return;let g=+document.getElementById('g').value||100,f=g/100,e={n:sel.n+' ('+g+'ج)',cal:Math.round(sel.cal*f),p:+(sel.p*f).toFixed(1),c:+(sel.c*f).toFixed(1),f:+(sel.f*f).toFixed(1),fi:+(sel.fi*f).toFixed(1)};let D=JSON.parse(localStorage.getItem('d')||'[]');D.push(e);localStorage.setItem('d',JSON.stringify(D));renderDay()}function renderDay(){let D=JSON.parse(localStorage.getItem('d')||'[]'),tc=0,tp=0,tc2=0,tf=0,tfi=0,h='';D.forEach((e,i)=>{tc+=e.cal;tp+=e.p;tc2+=e.c;tf+=e.f;tfi+=e.fi;h+=`<div style="display:flex;justify-content:space-between;background:#222;padding:8px;border-radius:8px;margin:4px 0;font-size:13px"><span>${e.n}</span><span>${e.cal} <b onclick="del(${i})" style="color:#ff6b35">✕</b></span></div>`});document.getElementById('tc').textContent=tc;document.getElementById('tp').textContent=tp.toFixed(1);document.getElementById('tc2').textContent=tc2.toFixed(1);document.getElementById('tf').textContent=tf.toFixed(1);document.getElementById('tfi').textContent=tfi.toFixed(1);document.getElementById('day').innerHTML=h||'<p style=color:#666;text-align:center>لسه ماضفتش</p>'}function del(i){let D=JSON.parse(localStorage.getItem('d')||'[]');D.splice(i,1);localStorage.setItem('d',JSON.stringify(D));renderDay()}function clearDay(){localStorage.removeItem('d');renderDay()}render();renderDay()</script></body></html>
