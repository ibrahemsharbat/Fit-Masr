<!doctype html><html dir=rtl lang=ar><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Fit Masr Test</title><style>body{margin:0;background:#0a0a0a;color:#fff;font-family:system-ui;padding:12px}input{width:100%;padding:14px;background:#1e1e1e;border:1px solid #333;border-radius:12px;color:#fff;margin:8px 0}.card{background:#171717;border-radius:12px;padding:12px;margin:8px 0;border:1px solid #222}.btn{padding:10px 14px;background:#ff6b35;color:#fff;border:0;border-radius:8px;font-weight:800}</style></head><body>
<h1>Fit Masr <span style=color:#ff6b35>TEST v3</span></h1>
<input id=q placeholder="جرب: رز مسلوق" oninput="render()">
<div id=list></div><div id=detail></div>
<h3>يومك: <span id=tc>0</span> سعر</h3><div id=day></div>
<script>
var FOODS=[
{n:"رز مصري مسلوق 100ج",cal:130,p:2.4},
{n:"رز بسمتي مسلوق 100ج",cal:121,p:2.5},
{n:"رز بسمتي بني مسلوق 100ج",cal:123,p:2.7},
{n:"كبدة فراخ 100ج",cal:167,p:24},
{n:"كبدة بقري 100ج",cal:135,p:20},
{n:"توست ابيض 25ج",cal:67,p:2},
{n:"توست بني 30ج",cal:75,p:3},
{n:"صدور فراخ 100ج",cal:165,p:31},
{n:"لبن خالي 100مل",cal:35,p:3.4},
{n:"خيار 100ج",cal:16,p:0.7}
];
var sel=null;
function render(){
var q=document.getElementById('q').value.toLowerCase();
var list=document.getElementById('list');list.innerHTML='';
var f=FOODS.filter(function(x){return x.n.toLowerCase().indexOf(q)>=0||q.split(' ').every(function(w){return x.n.toLowerCase().indexOf(w)>=0})});
for(var i=0;i<f.length;i++){var idx=FOODS.indexOf(f[i]);var d=document.createElement('div');d.className='card';d.innerHTML=f[i].n+' - '+f[i].cal+' سعر <button class=btn onclick=show('+idx+')>عرض</button>';list.appendChild(d);}
}
function show(i){sel=FOODS[i];document.getElementById('detail').innerHTML='<div class=card style=border:2px solid #ff6b35><b>'+sel.n+'</b><br>'+sel.cal+' سعر - '+sel.p+'g بروتين<br><br>الكمية جرام: <input id=gram type=number value=100><br><button class=btn onclick=add()>+ اضافة لليوم</button></div>'}
function add(){if(!sel)return;var g=+(document.getElementById('gram').value)||100;var e={n:sel.n+' ('+g+'ج)',cal:Math.round(sel.cal*g/100)};var day=JSON.parse(localStorage.getItem('fit')||'[]');day.push(e);localStorage.setItem('fit',JSON.stringify(day));renderDay();document.getElementById('detail').innerHTML='<div class=card style=background:#0f3d0f>✅ اتضاف: '+e.n+'</div>'}
function renderDay(){var day=JSON.parse(localStorage.getItem('fit')||'[]');var tc=0,h='';for(var i=0;i<day.length;i++){tc+=day[i].cal;h+=day[i].n+' - '+day[i].cal+'<br>'}document.getElementById('tc').textContent=tc;document.getElementById('day').innerHTML=h}
render();renderDay();
</script></body></html>
