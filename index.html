const cats=["الكل","حبوب","خضار","فواكه","بقوليات","جاهز","فراخ","لحوم","اسماك","البان","اضافات","بيض"];
let curCat="الكل",sel=null;
function switchTab(t){document.getElementById('foodTab').style.display=t=='food'?'block':'none';document.getElementById('goalsTab').style.display=t=='goals'?'block':'none';document.getElementById('clientTab').style.display=t=='client'?'block':'none';document.getElementById('tabFood').className=t=='food'?'on':'';document.getElementById('tabGoals').className=t=='goals'?'on':'';document.getElementById('tabClient').className=t=='client'?'on':''}
function initChips(){let c=document.getElementById('chips');c.innerHTML='';cats.forEach(cat=>{let b=document.createElement('button');b.className='chip'+(curCat==cat?' on':'');b.textContent=cat;b.onclick=()=>{curCat=cat;initChips();renderFoods()};c.appendChild(b)})}
function renderFoods(){let q=document.getElementById('q').value.toLowerCase();let list=document.getElementById('list');list.innerHTML='';let cnt=0;FOODS.filter(f=>{if(curCat!='الكل'&&f.cat!=curCat)return false;if(q&&!f.n.toLowerCase().includes(q))return false;return true}).forEach(f=>{if(cnt++>80)return;let idx=FOODS.indexOf(f);let div=document.createElement('div');div.className='card';div.innerHTML=`<div class=food style="margin:0;border:0;padding:0;background:transparent"><div><b>${f.n}</b><br><small style="color:#888">${f.cal} سعر • ${f.p}g بروتين • ${f.cat} ${f.alt? '• بديل: '+f.alt:''}</small></div><button class=btn onclick="showFood(${idx})">عرض</button></div>`;list.appendChild(div)})}
function showFood(i){sel=FOODS[i];let d=document.getElementById('detailBox');d.innerHTML=`<div class=card style="border:2px solid #ff6b35"><h3 style="margin:0">${sel.n}</h3><small style="color:#ff6b35">${sel.cat} • ${sel.st} • لكل 100ج ${sel.alt? ' • بديل: '+sel.alt:''}</small><div class=macro-grid><div class=macro><b style="color:#ff6b35">${sel.cal}</b><span>سعر</span></div><div class=macro><b>${sel.p}g</b><span>بروتين</span></div><div class=macro><b>${sel.c}g</b><span>كارب</span></div><div class=macro><b>${sel.f}g</b><span>دهون</span></div></div><div style="background:#0f0f0f;padding:8px;border-radius:10px;font-size:11px"><div>حديد ${sel.ir}mg • كالسيوم ${sel.ca}mg • الياف ${sel.fi}g • فيتامين A ${sel.vA} • C ${sel.vC}mg</div>${sel.alt? '<div style="margin-top:6px;color:#ff6b35">🔄 بديل: '+sel.alt+' بنفس البروتين تقريبا</div>':''}</div><div style="display:flex;gap:8px;margin-top:10px"><input id=gram type=number value=100 style="flex:1"><button class="btn btn-orange" style="flex:1" onclick="addFood()">+ اضافة لليوم</button></div></div>`;d.scrollIntoView({behavior:'smooth'})}
function getGoals(){return {p:+document.getElementById('gP').value||140,c:+document.getElementById('gC').value||200,f:+document.getElementById('gF').value||65,cal:+document.getElementById('gCal').value||2000}}
function saveGoals(){let g=getGoals();localStorage.setItem('fitGoals',JSON.stringify(g));renderGoalBars()}
function loadGoals(){let g=JSON.parse(localStorage.getItem('fitGoals')||'null');if(g){document.getElementById('gP').value=g.p;document.getElementById('gC').value=g.c;document.getElementById('gF').value=g.f;document.getElementById('gCal').value=g.cal}}
function renderGoalBars(){let g=getGoals();let day=JSON.parse(localStorage.getItem('fitmasr')||'[]');let tc=0,tp=0,tcarb=0,tf=0;day.forEach(e=>{tc+=e.cal;tp+=e.p;tcarb+=e.c;tf+=e.f});document.getElementById('goalBars').innerHTML=`<div class=goal-bar><div style="display:flex;justify-content:space-between;font-size:11px"><span>بروتين ${tp.toFixed(1)}/${g.p}g</span><span>${Math.round(tp/g.p*100)}%</span></div><div style="background:#222;border-radius:3px;height:6px;margin-top:4px"><div class=fill style="width:${Math.min(100,tp/g.p*100)}%"></div></div></div><div class=goal-bar><div style="display:flex;justify-content:space-between;font-size:11px"><span>كارب ${tcarb.toFixed(1)}/${g.c}g</span><span>${Math.round(tcarb/g.c*100)}%</span></div><div style="background:#222;border-radius:3px;height:6px;margin-top:4px"><div class=fill style="width:${Math.min(100,tcarb/g.c*100)}%"></div></div></div><div class=goal-bar><div style="display:flex;justify-content:space-between;font-size:11px"><span>دهون ${tf.toFixed(1)}/${g.f}g</span><span>${Math.round(tf/g.f*100)}%</span></div><div style="background:#222;border-radius:3px;height:6px;margin-top:4px"><div class=fill style="width:${Math.min(100,tf/g.f*100)}%"></div></div></div>`}
function addFood(){if(!sel)return;let g=+document.getElementById('gram').value||100,f=g/100,e={n:sel.n+' ('+g+'ج)',cal:Math.round(sel.cal*f),p:+(sel.p*f).toFixed(1),c:+(sel.c*f).toFixed(1),f:+(sel.f*f).toFixed(1),fi:+(sel.fi*f).toFixed(1)};let day=JSON.parse(localStorage.getItem('fitmasr')||'[]');day.push(e);localStorage.setItem('fitmasr',JSON.stringify(day));renderDay()}
function renderDay(){let day=JSON.parse(localStorage.getItem('fitmasr')||'[]');let tc=0,tp=0,tc2=0,tf=0,tfi=0,h='';day.forEach((e,i)=>{tc+=e.cal;tp+=e.p;tc2+=e.c;tf+=e.f;tfi+=e.fi;h+=`<div style="display:flex;justify-content:space-between;background:#1a1a1a;padding:8px;border-radius:10px;margin:4px 0;font-size:12px"><span>${e.n}</span><span><b style="color:#ff6b35">${e.cal}</b> <span onclick="delFood(${i})" style="color:#666">✕</span></span></div>`});let goals=getGoals();document.getElementById('tc').textContent=tc;document.getElementById('tcGoal').textContent=goals.cal;document.getElementById('tp').textContent=tp.toFixed(1)+'g';document.getElementById('tpGoal').textContent='بروتين /'+goals.p;document.getElementById('tcarb').textContent=tc2.toFixed(1)+'g';document.getElementById('tcGoal2').textContent='كارب /'+goals.c;document.getElementById('tf').textContent=tf.toFixed(1)+'g';document.getElementById('tfGoal').textContent='دهون /'+goals.f;document.getElementById('tfi').textContent=tfi.toFixed(1)+'g';document.getElementById('dayList').innerHTML=h||"<p style='color:#555;text-align:center;font-size:11px'>لسه ماضفتش اكل - ابدأ ضيف</p>";let remP=(goals.p-tp).toFixed(1),remC=(goals.c-tc2).toFixed(1),remF=(goals.f-tf).toFixed(1),remCal=goals.cal-tc;document.getElementById('remain').textContent=remCal>0?`فاضل ${remCal} سعر • ${remP}g بروتين • ${remC}g كارب • ${remF}g دهون`:`زيادة ${Math.abs(remCal)} سعر`;renderGoalBars()}
function delFood(i){let d=JSON.parse(localStorage.getItem('fitmasr')||'[]');d.splice(i,1);localStorage.setItem('fitmasr',JSON.stringify(d));renderDay()}
function clearDay(){localStorage.removeItem('fitmasr');renderDay()}
function calcClient(){let name=document.getElementById('cName').value||'عميل';let age=+document.getElementById('cAge').value;let h=+document.getElementById('cHeight').value;let w=+document.getElementById('cWeight').value;let gen=document.getElementById('cGender').value;let act=+document.getElementById('cActivity').value;let goal=document.getElementById('cGoal').value;if(!age||!h||!w){alert('دخل العمر والطول والوزن');return}let bmr=gen=='m'?10*w+6.25*h-5*age+5:10*w+6.25*h-5*age-161;let tdee=Math.round(bmr*act);let target=tdee;if(goal=='cut')target=tdee-300;if(goal=='bulk')target=tdee+300;let protein=Math.round(w*2.2);let fat=Math.round(w*1);let carb=Math.round((target-protein*4-fat*9)/4);document.getElementById('gP').value=protein;document.getElementById('gC').value=carb;document.getElementById('gF').value=fat;document.getElementById('gCal').value=target;saveGoals();renderDay();document.getElementById('clientResult').innerHTML=`<div class=result><h3>📊 نتائج ${name}</h3><div class=macro-grid><div class=macro><b>BMR</b><span style="color:#ff6b35">${Math.round(bmr)}</span></div><div class=macro><b>TDEE</b><span style="color:#ff6b35">${tdee}</span></div><div class=macro><b>الهدف</b><span style="color:#ff6b35">${target}</span></div><div class=macro><b>بروتين</b><span style="color:#ff6b35">${protein}g</span></div></div><div style="background:#0f0f0f;padding:10px;border-radius:12px;margin-top:8px;font-size:12px">🔥 ${target} سعر | 💪 ${protein}g بروتين | 🍞 ${carb}g كارب | 🥑 ${fat}g دهون<br><small style="color:#888">تم وضع الهدف تلقائيا في تبويب الماكروز</small></div></div>`;switchTab('goals')}
loadGoals();initChips();renderFoods();renderDay();renderGoalBars();
</script></body></html>
