<!doctype html><html dir=rtl lang=ar><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>IBRAHEM FIT Coach</title><style>body{margin:0;background:#0a0a0a;color:#fff;font-family:sans-serif;padding:14px}h1{color:#ff6b35}input,select{width:100%;padding:12px;margin:6px 0;background:#1e1e1e;border:1px solid #333;color:#fff;border-radius:10px}.btn{background:#ff6b35;color:#fff;border:0;border-radius:10px;padding:14px;width:100%;font-weight:900;margin-top:8px}.card{background:#171717;border:1px solid #262626;border-radius:16px;padding:12px;margin:10px 0}</style></head><body><h1>IBRAHEM FIT <span style=color:#fff;font-size:14px>Coach v1</span></h1><div class=card><h3>اضافة عميل</h3><input id=name placeholder="اسم العميل"><select id=goal><option value=cut>تخسيس</option><option value=bulk>تضخيم</option></select><input id=weight placeholder="الوزن"><input id=cal placeholder="السعرات"><button class=btn onclick=add()>+ اضافة</button></div><div id=list></div><script>let clients=JSON.parse(localStorage.getItem('coach')||'[]');function add(){let n=document.getElementById('name').value;let g=document.getElementById('goal').value;let w=document.getElementById('weight').value;let c=document.getElementById('cal').value;if(!n)return alert('اكتب الاسم');clients.push({name:n,goal:g,w:w,c:c});localStorage.setItem('coach',JSON.stringify(clients));render();alert('اتضاف '+n)}function render(){let el=document.getElementById('list');el.innerHTML='';clients.forEach(cl=>{el.innerHTML+=`<div class=card><b>${cl.name}</b> - ${cl.goal=='cut'?'تخسيس':'تضخيم'} - ${cl.w}كجم - ${cl.c} سعر<br><button class=btn style=background:#25D366;margin-top:6px onclick="window.open('https://wa.me/?text=ازيك يا ${cl.name} دي خطتك من IBRAHEM FIT')">واتساب</button></div>`})}render();</script></body></html>
